name = "brailleTableSwitcher"
summary = "Braille Table Switcher"
description = "Cycle braille output tables with NVDA+Alt+B and input tables with NVDA+Alt+I; NVDA+Alt+O reports the current table; NVDA+Alt+P chooses which tables to cycle. Includes Taiwanese Mandarin bopomofo braille with polyphone fixes and a contracted reading table (tones on dots 7 and 8)."
author = "hurt<hurt.nzsmr@gmail.com>; Claude"
version = "1.3.0"
url = "https://github.com/hurthuang/NVDA-brailleTableSwitcher"
minimumNVDAVersion = "2021.1"
lastTestedNVDAVersion = "2026.2"

[brailleTables]
[[zh-tw-ueb-g1.ctb]]
displayName = 中文點字 + UEB Grade 1
contracted = False
output = True
input = False

[[zh-tw-ueb-g2.ctb]]
displayName = 中文點字 + UEB Grade 2
contracted = True
output = True
input = False

[[zh-tw-fix.ctb]]
displayName = 注音點字（多音字修正）
contracted = False
output = True
input = False

[[zh-tw-short.ctb]]
displayName = 縮點閱讀（注音點字，聲調併入第 7、8 點）
contracted = False
output = True
input = False
